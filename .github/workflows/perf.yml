# `pnpm perf`: the §11 probe on the ChatSpace stand and the Fansly
# acceptance gate P16a (packages/testing/e2e/perf/*perf-probe.e2e.ts), about
# 50 minutes. Too long for the CI of a PR or a push: inside it the part
# «e2e 1/5» took 55 minutes instead of 7, and every run waited for it.
#
# Every night on main, and by hand on any branch (Actions → Perf → Run
# workflow, «Use workflow from»): before a release, on its branch, for the
# release note's line `perf` (docs/release.md, section 5).
#
# On a GitHub-hosted runner (owner, 2026-10-21: the repository is public, so
# the ~60 minutes a night are free, and it must never reach the owner's PC).
# The probes compare the extension with a fresh base on the same machine — the
# job's own runner — so a cloud runner's speed does not move the verdict.

name: Perf

on:
  schedule:
    # 22:17 UTC, 01:17 in Moscow: the quietest night hour of this repository's
    # CI; well before hub's Nightly (02:20 UTC).
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time; a run by hand waits for the nightly one.
concurrency:
  group: perf
  cancel-in-progress: false

jobs:
  perf:
    name: pnpm perf
    runs-on: ubuntu-24.04
    # 40-60 minutes with setup on the PC; a cloud runner gets room.
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The same step as in ci.yml; tools/ci/e2e-docker.sh mounts this prefix
      # into the container.
      - name: Setup pnpm
        run: |
          pinned="$(node -p 'require("./package.json").packageManager')"
          pinned="${pinned%%+*}"
          prefix="$RUNNER_TEMP/pnpm"
          npm install --global --prefix "$prefix" --prefer-offline --no-audit --no-fund --loglevel=error "$pinned"
          running="$("$prefix/bin/pnpm" --version)"
          [ "pnpm@$running" = "$pinned" ] || { echo "::error::pnpm $running is installed but package.json pins $pinned"; exit 1; }
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The e2e job's container: the pinned image, --network none, and the
      # container removed when the run is cancelled (`exec`, see ci.yml).
      - name: pnpm perf (headless Firefox in the pinned image, no network)
        env:
          # As in the e2e job: a shared cloud runner. Only time limits scale
          # (budgetMs, the Fansly gate's); memory, timers and counts stay strict.
          CG_E2E_TIMING_SLACK: '3'
        run: exec tools/ci/e2e-docker.sh perf

      - name: Remove the e2e container, if one is left
        if: always()
        run: if [ -x tools/ci/e2e-docker.sh ]; then tools/ci/e2e-docker.sh --remove-container; fi

      # The numbers of both probes, about:memory and Firefox profiles of the
      # Fansly gate, and the WebdriverIO logs; the stand is synthetic.
      - name: Upload reports, profiles and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cache/e2e/perf.json
            .cache/e2e/perf-fansly/gate
            .cache/wdio
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
