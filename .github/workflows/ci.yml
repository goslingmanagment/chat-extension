# CI (docs/architecture.md §13, docs/release.md «CI»).
#
# On a PR, on every push to main and on a manual run:
#   check      `pnpm check` — typecheck, lint, test, build, webext-lint, size,
#              gates, parity, archive-check (§3);
#   e2e-part   `pnpm e2e` in parts side by side — headless Firefox and
#              geckodriver inside the image pinned by digest in
#              tools/ci/e2e-image.sh, in a container with no network; each part
#              builds for itself and runs its share of the spec files
#              (CG_E2E_SHARD, packages/testing/src/e2e-shards.ts);
#   e2e        «pnpm e2e», the required check: green only when every part is.
#
# Not here: `pnpm perf` (the §11 and Fansly P16a probes, about 50 minutes)
# runs every night and on demand in perf.yml.
#
# Drafts: while CI runs on the owner's PC (CI_POOL=pc, free) a Draft PR runs
# everything, so an executor needs no full e2e run of its own; on GitHub's
# runners (paid) a Draft runs nothing — every job is skipped (a skipped job
# costs no runner and counts as passed for a required check) — and marking the
# PR ready starts them. Marking a PR that ran on the PC ready runs CI once more:
# GitHub tests the PR merged into its base, and the base may have moved since
# the Draft's run. If it has not, the merge is the same tree, and the run ends
# green at once (next paragraph).
#
# A tree that already passed does not run again. A green run leaves the proof
# of the tree it tested — an artifact `ci-proof-<tree>` from the job «pnpm
# e2e», once `check` and every part passed. Each job of a later run asks for
# its own tree first (tools/ci/ci-proof.ts): with a proof from a completed,
# successful run of this workflow, every step after the question is skipped
# and the job ends green — the jobs still run, so no required check reads a
# «skipped». That is a PR marked ready while its base stayed put, and a push
# to main after merging such a PR: in 13–16.10, 98 of 336 full runs. A tree is
# the whole checkout, workflow files included; a manual run and a re-run
# always run in full, and a failed lookup is a miss.
#
# A change of documents alone — docs/**, site/**, *.md in the root — does not
# run the e2e suite: each part starts, sees what changed (its second step,
# tools/ci/e2e-needed.sh) and ends green within seconds instead of running its
# share. `check` always runs in full: it is what tests the site, the changelog
# and the parity tables. Why inside the job and not `paths-ignore` on the
# workflow: a workflow that does not start reports nothing, and a PR with a
# required check would wait for it forever. Why not a job of its own in front:
# that is a second wait for a runner (and for the PC's priority hook).
#
# Runner pool, as in hub, fansly-chat, onlyfans-chat and taskindex: the
# repository variable CI_POOL=pc sends the first attempt to the owner's
# self-hosted runners; any other value, and every re-run (the PC may have died
# mid-run), uses GitHub-hosted runners. On the PC the suite runs as five parts
# (six runners: `check` and five parts at once; the gate «pnpm e2e» goes to the
# light runner, label ci-pc-control); on GitHub as one, so the paid
# minutes stay what they were. Branch protection matches a required check by
# the job's `name:` — «pnpm check» and «pnpm e2e»: keep the names.
#
# No secret is read here and none is needed: the jobs build, lint and test
# against the synthetic stand and the fake hub on loopback. The runners hold no
# production credentials, no browser profile with OnlyMonster and no cookies.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A superseded PR head has nothing left to prove — cancel its run (a Draft's
# too: the group is the PR's). Each push to main (and each manual run) gets a
# group of its own: GitHub keeps only ONE pending run per group, so a shared
# group would let a newer push evict an older pending one, and main keeps a
# finished run per commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: pnpm check
    # A Draft runs only on the PC (see the top of the file).
    if: github.event.pull_request.draft != true || vars.CI_POOL == 'pc'
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    # Reading earlier runs' proofs (tools/ci/ci-proof.ts) needs actions:read.
    permissions:
      actions: read
      contents: read
    # For the gate job: the tree this run tested, and the run that already had.
    outputs:
      tree: ${{ steps.proof.outputs.tree }}
      proven_by: ${{ steps.proof.outputs.proven_by }}
    env:
      # Type-aware ESLint exhausted the former 4 GiB heap in run 38855233102
      # as the workspace grew. Leave headroom for its TypeScript projects;
      # this is a ceiling per Node process, not a reservation.
      NODE_OPTIONS: --max-old-space-size=8192

    steps:
      # Two commits deep: on a PR this is GitHub's merge commit, and `pnpm
      # gates` reads what the PR changes against its first parent, the base
      # branch (tools/gates/change.ts: Fansly's files alone never rewrite
      # ChatSpace's byte pins).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Node 26 (.nvmrc). The PC image has no Node on PATH: every job brings
      # its own.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The same tree already passed (see the top of the file): every step
      # below is skipped and the job ends green.
      - name: Did this tree already pass?
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/ci-proof.ts >> "$GITHUB_OUTPUT"

      # Node 26 ships no corepack (the other repositories take pnpm from the
      # corepack of Node 22), so npm installs pnpm at the exact version
      # package.json "packageManager" pins — one pin, no drift — into this
      # job's runner temp: nothing shared between runners changes. npm's own
      # cache in $HOME serves the next job on the PC without the registry.
      - name: Setup pnpm
        if: steps.proof.outputs.proven_by == ''
        run: |
          pinned="$(node -p 'require("./package.json").packageManager')"
          pinned="${pinned%%+*}"
          prefix="$RUNNER_TEMP/pnpm"
          npm install --global --prefix "$prefix" --prefer-offline --no-audit --no-fund --loglevel=error "$pinned"
          running="$("$prefix/bin/pnpm" --version)"
          echo "npm $(npm --version) installed pnpm $running; package.json pins $pinned"
          [ "pnpm@$running" = "$pinned" ] || { echo "::error::pnpm $running is installed but package.json pins $pinned"; exit 1; }
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # The PC's runners share one pnpm store in $HOME (safe for concurrent
      # installs, same filesystem as the work dirs, so packages hard-link).
      # Hosted runners use pnpm's default store and no Actions cache: they are
      # the fallback, and a cold install here is under a minute.
      - name: Install dependencies
        if: steps.proof.outputs.proven_by == ''
        env:
          PNPM_PC_STORE: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: |
          if [ -n "$PNPM_PC_STORE" ]; then export npm_config_store_dir="$HOME/.local/share/pnpm/store"; fi
          pnpm install --frozen-lockfile

      - name: Check
        if: steps.proof.outputs.proven_by == ''
        run: pnpm check

      # architecture.md §14: known vulnerabilities are reported, they do not
      # fail the job (the registry's answer changes without a commit of ours).
      - name: Dependency audit (warnings only)
        if: steps.proof.outputs.proven_by == ''
        run: pnpm audit --audit-level high || echo "::warning title=pnpm audit::pnpm audit reports vulnerabilities or could not reach the registry — see the log of this step"

  e2e-part:
    name: e2e ${{ matrix.shard }}
    if: github.event.pull_request.draft != true || vars.CI_POOL == 'pc'
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc"]') || 'ubuntu-24.04' }}
    # The whole suite is about 20 minutes on the PC and 28 on a GitHub runner
    # (one part there); slower runners and the PC's priority hook get room.
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    strategy:
      # Every part reports: a red part does not cancel the others, so one run
      # names every failing spec file. On the PC the parts cost nothing.
      fail-fast: false
      # Each part names itself and the count, «<k>/<n>»: a part re-run on
      # GitHub runs the same spec files as on the PC. Five on the PC — the PC
      # has six runners for this repository, `check` takes one (the parts weigh
      # ~4 minutes each, packages/testing/e2e/shard-weights.json) — one on
      # GitHub.
      matrix:
        shard: ${{ fromJSON(vars.CI_POOL == 'pc' && '["1/5","2/5","3/5","4/5","5/5"]' || '["1/1"]') }}

    steps:
      # Two commits deep: on a PR this is GitHub's merge commit, and the next
      # step compares it with its first parent, the base branch.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Documents alone (see the top of this file): every step below is
      # skipped and the job ends green. Any doubt is `e2e=true`; the steps test
      # for «not false», so a step that said nothing skips nothing either.
      - name: Does this change need e2e?
        id: scope
        env:
          CG_PUSH_BEFORE: ${{ github.event.before }}
        run: tools/ci/e2e-needed.sh >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.scope.outputs.e2e != 'false'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The same tree already passed: the steps below are skipped, as for
      # documents alone.
      - name: Did this tree already pass?
        id: proof
        if: steps.scope.outputs.e2e != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/ci-proof.ts >> "$GITHUB_OUTPUT"

      # The same step as in `check`; tools/ci/e2e-docker.sh mounts this prefix
      # into the container.
      - name: Setup pnpm
        if: steps.scope.outputs.e2e != 'false' && steps.proof.outputs.proven_by == ''
        run: |
          pinned="$(node -p 'require("./package.json").packageManager')"
          pinned="${pinned%%+*}"
          prefix="$RUNNER_TEMP/pnpm"
          npm install --global --prefix "$prefix" --prefer-offline --no-audit --no-fund --loglevel=error "$pinned"
          running="$("$prefix/bin/pnpm" --version)"
          echo "npm $(npm --version) installed pnpm $running; package.json pins $pinned"
          [ "pnpm@$running" = "$pinned" ] || { echo "::error::pnpm $running is installed but package.json pins $pinned"; exit 1; }
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        if: steps.scope.outputs.e2e != 'false' && steps.proof.outputs.proven_by == ''
        env:
          PNPM_PC_STORE: ${{ runner.environment == 'self-hosted' && '1' || '' }}
        run: |
          if [ -n "$PNPM_PC_STORE" ]; then export npm_config_store_dir="$HOME/.local/share/pnpm/store"; fi
          pnpm install --frozen-lockfile

      # Both builds, the stand, the fake hub, WebdriverIO, geckodriver and
      # Firefox all run inside one container with --network none: rootless
      # Docker on the PC, the stock daemon on a hosted runner. Each part builds
      # for itself (about 20 s on the PC — less than handing a build over
      # through an artifact) and runs its share of the spec files.
      #
      # `exec`: when a run is cancelled (a newer push to the PR does that) or
      # times out, the runner signals the step's own process and nothing below
      # it. Without `exec` that process is the shell around the script: it
      # dies, and the container goes on running the suite in this checkout.
      # With it the script takes the signal and removes its container.
      - name: e2e (headless Firefox in the pinned image, no network)
        if: steps.scope.outputs.e2e != 'false' && steps.proof.outputs.proven_by == ''
        env:
          CG_E2E_SHARD: ${{ matrix.shard }}
          # Parallel jobs share the PC: timings catch a 3× regression; local runs stay strict.
          CG_E2E_TIMING_SLACK: '3'
        run: exec tools/ci/e2e-docker.sh

      # What a SIGKILL leaves: the script had ten seconds and did not make it.
      - name: Remove the e2e container, if one is left
        if: always() && steps.scope.outputs.e2e != 'false'
        run: if [ -x tools/ci/e2e-docker.sh ]; then tools/ci/e2e-docker.sh --remove-container; fi

      # WebdriverIO and geckodriver logs of a failed run; the stand is
      # synthetic, so there is nothing private in them.
      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ github.run_id }}-${{ github.run_attempt }}-part-${{ strategy.job-index }}
          path: .cache/wdio
          if-no-files-found: ignore
          retention-days: 7

  # The required check «pnpm e2e». It only reads the parts' result: green when
  # every part is (a part that saw documents alone is green too), red when any
  # failed, was cancelled or never ran. `always()`: without it a failed or
  # cancelled part would make this job «skipped», and a required check reads
  # «skipped» as passed. A Draft on GitHub's runners skips it with the parts.
  # It also waits for `check`: with both green it leaves the proof of the tree.
  e2e:
    name: pnpm e2e
    needs: [check, e2e-part]
    if: always() && (github.event.pull_request.draft != true || vars.CI_POOL == 'pc')
    # Seconds of shell. On the PC it asks for ci-pc-control, as hub's gates:
    # the light runner winpc-chat-extension-gate-1 carries only that label,
    # so the gate no longer waits behind other runs' parts for a heavy runner,
    # and a job there skips the priority hook (ci-runners README «Раннеры под
    # гейты»). The heavy runners carry it too: with the light one busy or down
    # the gate falls back to them. Off the PC the smallest GitHub runner does.
    runs-on: ${{ vars.CI_POOL == 'pc' && github.run_attempt == '1' && fromJSON('["self-hosted","ci-pc-control"]') || 'ubuntu-slim' }}
    # Seconds of work; the rest is room for the PC's priority hook on a heavy runner.
    timeout-minutes: 15

    steps:
      - name: Every part of the suite passed
        env:
          PARTS: ${{ needs.e2e-part.result }}
        run: |
          echo "the parts of the e2e suite: $PARTS"
          [ "$PARTS" = success ] || { echo "::error title=pnpm e2e::a part of the e2e suite did not pass ($PARTS) — see the e2e jobs of this run"; exit 1; }

      # The proof for a later run of the same tree (tools/ci/ci-proof.ts):
      # `pnpm check` and every part green, and the tree not proven before.
      # The run's own success is what the lookup checks; this only names it.
      - name: Record the proof of this tree
        if: needs.check.result == 'success' && needs.e2e-part.result == 'success' && needs.check.outputs.proven_by == ''
        env:
          TREE: ${{ needs.check.outputs.tree }}
        run: |
          [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=pnpm e2e::pnpm check named no tree ($TREE)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ci-proof"
          printf '%s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/ci-proof/run-id"

      - name: Publish the proof
        if: needs.check.result == 'success' && needs.e2e-part.result == 'success' && needs.check.outputs.proven_by == ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-proof-${{ needs.check.outputs.tree }}
          path: ${{ runner.temp }}/ci-proof/run-id
          if-no-files-found: error
          retention-days: 30
