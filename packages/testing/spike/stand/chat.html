<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>spike · fansly-like chat</title>
    <script>
      // First page script: what it sees tells whether MAIN stood before it.
      (function () {
        var html = document.documentElement;
        html.dataset.order = (html.dataset.order || '') + 'page,';
        window.__pageSaw = {
          ws: Function.prototype.toString.call(window.WebSocket),
          xhr: Function.prototype.toString.call(window.XMLHttpRequest),
          protoCtor: window.XMLHttpRequest.prototype.constructor === window.XMLHttpRequest,
          cgInstall: typeof window.__cgSpikeInstall === 'object' ? window.__cgSpikeInstall : null,
          at: performance.now(),
        };
      })();
    </script>
    <style>
      body { font: 14px sans-serif; margin: 0; }
      app-group-message-input { display: flex; flex-direction: column; border-top: 1px solid #ccc; padding: 8px; }
      .message-composer { display: flex; gap: 8px; align-items: center; }
      textarea.message-input { flex: 1; height: 40px; }
      .send-button { width: 80px; height: 40px; }
    </style>
    <script type="module" src="/chat.js"></script>
  </head>
  <body>
    <app-root>
      <app-messages-route>
        <div class="content-wrapper">
          <div class="messages-list-wrapper"></div>
          <div class="messages-content-wrapper"></div>
        </div>
      </app-messages-route>
    </app-root>
  </body>
</html>
